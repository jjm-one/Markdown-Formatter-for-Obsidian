# Example: fail a pull request when the vault's Markdown is not formatted.
# Copy into your repo's .github/workflows/ and pin the release version in the URL.
# Action SHAs below are pinned for supply-chain safety; `# vX.Y.Z` keeps them legible.

name: Markdown formatting

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Download Markdown Formatter
        run: |
          curl -fsSL \
            -o /tmp/markdown-formatter.cjs \
            https://github.com/jjm-one/Markdown-Formatter-for-Obsidian/releases/download/0.1.0/markdown-formatter-cli.cjs
      - name: Check Obsidian vault formatting
        run: node /tmp/markdown-formatter.cjs check .
