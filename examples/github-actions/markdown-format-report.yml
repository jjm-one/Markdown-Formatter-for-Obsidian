# Example: check the vault's Markdown formatting and upload the results as a
# SARIF report, so GitHub annotates the offending lines directly on the pull
# request diff (Files changed tab) via code scanning.
# Copy into your repo's .github/workflows/ and pin the release version in the URL.
# Action SHAs below are pinned for supply-chain safety; `# vX.Y.Z` keeps them legible.

name: Markdown formatting report

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown-format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload-sarif
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Download Markdown Formatter
        run: |
          curl -fsSL \
            -o /tmp/markdown-formatter.cjs \
            https://github.com/jjm-one/Markdown-Formatter-for-Obsidian/releases/download/0.1.0/markdown-formatter-cli.cjs

      # `continue-on-error` so the SARIF upload below still runs when formatting
      # is needed (check exits 1); the job is failed explicitly in the last step.
      - name: Check Obsidian vault formatting
        id: check
        continue-on-error: true
        run: node /tmp/markdown-formatter.cjs check . --report-file formatter.sarif --report-format sarif

      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: formatter.sarif
          category: markdown-formatter

      - name: Fail if formatting was needed
        if: steps.check.outcome == 'failure'
        run: exit 1
