# Weekly, grouped version-update PRs for npm, GitHub Actions, and the example
# Docker base image. Security updates are enabled in repository settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    versioning-strategy: increase
    commit-message:
      prefix: "⬆️ " # gitmoji: upgrade dependencies
      include: scope
    labels:
      - dependencies
    groups:
      # The lint/type toolchain is peer-coupled, so it moves as one PR across all
      # update types — otherwise a partial bump leaves the peer tree unresolvable.
      lint-and-types:
        patterns:
          - "eslint"
          - "eslint-plugin-*"
          - "@eslint/*"
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "globals"
        update-types:
          - major
          - minor
          - patch
      runtime-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        exclude-patterns:
          - "eslint"
          - "eslint-plugin-*"
          - "@eslint/*"
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "globals"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "⬆️ " # gitmoji: upgrade dependencies
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/examples/docker"
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "⬆️ " # gitmoji: upgrade dependencies
      include: scope
    labels:
      - dependencies
      - docker
    groups:
      docker:
        patterns:
          - "*"
