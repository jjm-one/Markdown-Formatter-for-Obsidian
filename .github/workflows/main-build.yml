name: Main development build

# After a green CI run on main, publish the mutable "main-latest" development prerelease.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-development-build
  cancel-in-progress: true

jobs:
  publish:
    name: Publish latest main build
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # force-move the main-latest tag and publish its prerelease
      id-token: write # sign the build provenance
      attestations: write # record the build provenance
    env:
      ROLLING_TAG: main-latest

    steps:
      # Always builds the current tip of `main` (a trusted ref). The workflow_run
      # trigger only gates *when* to publish, via the job `if:` above — the
      # triggering run's head SHA is never checked out.
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve source commit
        id: source
        shell: bash
        run: |
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Require reproducible dependency lock
        shell: bash
        run: test -f package-lock.json || { echo "package-lock.json is required." >&2; exit 1; }

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Compute development version
        id: version
        shell: bash
        env:
          SHORT_SHA: ${{ steps.source.outputs.short_sha }}
        run: |
          BASE_VERSION="$(node -p "require('./package.json').version")"
          # Keep the result valid SemVer: 0.1.0 -> 0.1.0-main.N.sha; a pre-release
          # base extends with a dot (0.1.0-beta.1 -> 0.1.0-beta.1.main.N.sha).
          if [[ "$BASE_VERSION" == *-* ]]; then
            BUILD_VERSION="${BASE_VERSION}.main.${GITHUB_RUN_NUMBER}.${SHORT_SHA}"
          else
            BUILD_VERSION="${BASE_VERSION}-main.${GITHUB_RUN_NUMBER}.${SHORT_SHA}"
          fi
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build development artifacts
        env:
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: npm run build

      - name: Smoke-test bundled standalone CLI
        run: npm run test:cli-bundle

      - name: Package development snapshot
        env:
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
          BUILD_SHA: ${{ steps.source.outputs.head_sha }}
          BUILD_RUN: ${{ github.run_id }}
        run: npm run package:main-build && npm run verify:main-build

      - name: Upload immutable commit artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: markdown-formatter-main-${{ steps.source.outputs.short_sha }}
          path: main-build/
          if-no-files-found: error
          retention-days: 30

      - name: Generate SLSA build provenance
        id: provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            main-build/main.js
            main-build/markdown-formatter-cli.cjs
            main-build/manifest.json
            main-build/markdown-formatter-main.zip
            main-build/build-info.json

      - name: Stage provenance as a release asset
        if: ${{ steps.provenance.outputs.bundle-path != '' }}
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" main-build/markdown-formatter-main.intoto.jsonl

      - name: Update rolling main tag
        shell: bash
        env:
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
        run: |
          git tag -f "$ROLLING_TAG" "$HEAD_SHA"
          git push origin "refs/tags/$ROLLING_TAG" --force

      - name: Publish rolling development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
        shell: bash
        run: |
          cat > /tmp/main-release-notes.md <<NOTES
          # Latest successful build of main

          **Development build — not a stable release.**

          - Development version: \`$BUILD_VERSION\`
          - Source commit: \`$HEAD_SHA\`
          - Source branch: \`main\`
          - Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          This prerelease is updated after a successful CI run on \`main\`. Its tag and assets are intentionally mutable. For reproducible installs, choose a versioned release instead.
          NOTES

          if gh release view "$ROLLING_TAG" >/dev/null 2>&1; then
            gh release edit "$ROLLING_TAG" \
              --title "Latest main build" \
              --notes-file /tmp/main-release-notes.md \
              --prerelease
          else
            gh release create "$ROLLING_TAG" \
              --verify-tag \
              --title "Latest main build" \
              --notes-file /tmp/main-release-notes.md \
              --prerelease
          fi

          shopt -s nullglob
          gh release upload "$ROLLING_TAG" \
            main-build/main.js \
            main-build/markdown-formatter-cli.cjs \
            main-build/manifest.json \
            main-build/styles.css \
            main-build/LICENSE \
            main-build/THIRD_PARTY_NOTICES.md \
            main-build/build-info.json \
            main-build/markdown-formatter-main.zip \
            main-build/*.intoto.jsonl \
            --clobber
