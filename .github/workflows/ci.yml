name: CI

# Tiered checks:
#   - feature branch push        -> unit tests only
#   - push to main / develop     -> full validate, build, package
#   - pull request (any target)  -> full validate, build, package
#   - push to main / PR to main  -> also audit dependencies
# The heavier scans (CodeQL, Semgrep, Dependency Review, Fuzz, Scorecard) run
# only on main and on PRs into main, from their own workflows.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-tests:
    name: Unit tests
    if: >-
      github.event_name == 'push'
      && github.ref != 'refs/heads/main'
      && github.ref != 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Require reproducible dependency lock
        shell: bash
        run: test -f package-lock.json || { echo "package-lock.json is required." >&2; exit 1; }

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

  build:
    name: Validate, build, and package
    if: >-
      github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
      || github.ref == 'refs/heads/main'
      || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Require reproducible dependency lock
        shell: bash
        run: test -f package-lock.json || { echo "package-lock.json is required." >&2; exit 1; }

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate, build, and verify release archive
        run: npm run ci

      - name: Upload CI build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: markdown-formatter-${{ github.sha }}
          path: |
            main.js
            markdown-formatter-cli.cjs
            manifest.json
            styles.css
            LICENSE
            THIRD_PARTY_NOTICES.md
            release/*.zip
          if-no-files-found: error
          retention-days: 14

  security-audit:
    name: Audit dependencies for known vulnerabilities
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Require reproducible dependency lock
        shell: bash
        run: test -f package-lock.json || { echo "package-lock.json is required." >&2; exit 1; }

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      # Fail on a known high/critical advisory anywhere in the dependency tree.
      - name: npm audit
        run: npm audit --audit-level=high
