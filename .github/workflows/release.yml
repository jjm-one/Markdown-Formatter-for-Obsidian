name: Release

# On a semantic-version tag: validate, build, package, attest provenance, and publish the GitHub Release.

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example 0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub Release and upload assets
      id-token: write # sign the build provenance
      attestations: write # record the build provenance
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Validate release tag
        run: node scripts/check-versions.mjs

      - name: Require reproducible dependency lock
        shell: bash
        run: test -f package-lock.json || { echo "package-lock.json is required for releases." >&2; exit 1; }

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate source and run tests
        run: npm run verify

      - name: Build plugin
        run: npm run build

      - name: Smoke-test bundled standalone CLI
        run: npm run test:cli-bundle

      - name: Build and verify installable ZIP
        run: npm run package:release && npm run verify:release

      - name: Build npm package archive
        run: npm pack --ignore-scripts --pack-destination release

      - name: Generate SLSA build provenance
        id: provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            main.js
            markdown-formatter-cli.cjs
            manifest.json
            styles.css
            release/*.zip
            release/*.tgz

      - name: Stage provenance as a release asset
        if: ${{ steps.provenance.outputs.bundle-path != '' }}
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "release/markdown-formatter-${RELEASE_TAG}.intoto.jsonl"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # A SemVer pre-release tag (contains "-", e.g. 0.1.0) is
          # published as a GitHub pre-release and is not marked "Latest".
          prerelease_flag=""
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi
          assets=(
            main.js
            markdown-formatter-cli.cjs
            manifest.json
            styles.css
            LICENSE
            THIRD_PARTY_NOTICES.md
            release/*.zip
            release/*.tgz
            release/*.intoto.jsonl
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              $prerelease_flag \
              --title "$RELEASE_TAG" \
              --generate-notes \
              "${assets[@]}"
          fi
