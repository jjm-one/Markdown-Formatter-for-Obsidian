name: Fuzz

# Coverage-guided fuzzing of the formatter core with jazzer.js: a short run on
# PRs that touch it, a longer weekly run.

on:
  pull_request:
    paths:
      - "src/core/**"
      - "fuzz/**"
      - "esbuild.config.mjs"
      - "package-lock.json"
  schedule:
    - cron: "37 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: jazzer.js
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Require reproducible dependency lock
        shell: bash
        run: test -f package-lock.json || { echo "package-lock.json is required." >&2; exit 1; }

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build fuzz bundle
        run: npm run build:fuzz

      - name: Fuzz
        run: |
          npx jazzer fuzz/format.fuzz.cjs -- \
            -max_total_time=${{ github.event_name == 'schedule' && 600 || 120 }} \
            -print_final_stats=1

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes
          path: |
            crash-*
            timeout-*
            oom-*
          if-no-files-found: ignore
          retention-days: 14
