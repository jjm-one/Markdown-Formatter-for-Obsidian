name: Fuzz

# Coverage-guided fuzzing of the formatter core with jazzer.js. Pull requests
# replay the committed corpus (a deterministic regression check); the weekly run
# and manual dispatch explore for new inputs.

on:
  pull_request:
    branches: [main]
    paths:
      - "src/core/**"
      - "fuzz/**"
      - "package-lock.json"
  schedule:
    - cron: "37 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: jazzer.js
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Require reproducible dependency lock
        shell: bash
        run: test -f package-lock.json || { echo "package-lock.json is required." >&2; exit 1; }

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build fuzz bundle
        run: npm run build:fuzz

      # Pull requests: replay the committed corpus once, no new-input generation.
      # Deterministic, so a red result is a real regression, never a flake.
      - name: Replay corpus
        if: github.event_name == 'pull_request'
        run: npx jazzer fuzz/format.fuzz.cjs fuzz/corpus -- -runs=0 -timeout=20 -rss_limit_mb=4096 -print_final_stats=1

      # Scheduled / manual: explore for new inputs, seeded from the corpus.
      - name: Fuzz
        if: github.event_name != 'pull_request'
        run: |
          npx jazzer fuzz/format.fuzz.cjs fuzz/corpus -- \
            -max_total_time=${{ github.event_name == 'schedule' && 600 || 120 }} \
            -timeout=20 -rss_limit_mb=4096 -print_final_stats=1

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: |
            crash-*
            timeout-*
            oom-*
            slow-unit-*
          if-no-files-found: ignore
          retention-days: 14
