name: Semgrep

# Static analysis with Semgrep OSS, alongside CodeQL. Runs regardless of
# repository visibility (CodeQL needs a public repo or GHAS).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    # Official image — a working Semgrep environment without a PyPI install.
    container:
      image: semgrep/semgrep@sha256:12672acdb0949e19f9f6a4c2b288edd0b404f268f0ca7738a2c06f372f50362e # v1.176.0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/default \
            --config p/security-audit \
            --metrics=off \
            --exclude-rule package_managers.npm.npm-missing-minimum-release-age \
            --sarif --output semgrep.sarif
        # min-release-age in .npmrc breaks Dependabot; the cooldown lives in dependabot.yml.

      - name: Upload SARIF to code scanning
        if: ${{ always() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: semgrep.sarif
          category: semgrep
