name: Feature request
description: Suggest a formatter, configuration, compatibility, or workflow improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What Markdown workflow should become easier or safer?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example Markdown or configuration
      description: Use synthetic data only.
